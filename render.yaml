# NOUVII backend on Render — deploy with: render.com → New + → Blueprint →
# select this repo → Apply. Creates the API service and its Postgres database.
#
# Costs (editable on the review screen before you apply):
#   - web service "starter" ($7/mo) — needed for the persistent photo disk
#     and no cold starts. Change to "free" only for throwaway testing:
#     free instances sleep when idle and CANNOT have a disk (delete the
#     `disk:` block too — uploaded photos would vanish on every deploy).
#   - database "basic-256mb" (~$6/mo). The "free" plan works but Render
#     deletes free databases after 30 days.

databases:
  - name: nouvii-db
    plan: basic-256mb
    databaseName: nouvii
    user: nouvii

services:
  - type: web
    name: nouvii-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build && npx prisma generate
    startCommand: node scripts/apply-schema.mjs && node dist/index.js
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nouvii-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /data/uploads
      - key: CORS_ORIGIN
        value: https://n0-uv-11-task-manager.vercel.app,https://n0-uv-11-task-manager-git-claude-n-bd0c66-nashaubrowns-projects.vercel.app,http://localhost:5173
      # Optional integrations — add values in the Render dashboard when ready:
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI
      # ANTHROPIC_API_KEY / AI_MODEL
      # VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT
